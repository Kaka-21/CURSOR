<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Viteroads (Physics + Particles + Audio)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; }
        #game-canvas { display:block; width:100vw; height:100vh; }
        #config-menu { position: absolute; top:50%; left:50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.85); color:#fff; padding:28px; border-radius:10px; z-index:30; width:340px; }
        #hud { position:absolute; left:16px; top:16px; color:#fff; z-index:40; background: rgba(0,0,0,0.35); padding:10px 12px; border-radius:8px; font-size:13px; }
        #skid-canvas { position:absolute; left:0; top:0; z-index:20; pointer-events:none; }
        #debug-panel { position: absolute; right: 16px; top: 16px; z-index:40; background: rgba(0,0,0,0.35); color: #fff; padding:10px; border-radius:8px; font-size:13px; }
        button, input, select { font-size:13px; }
        #tips { position:absolute; right:16px; bottom:16px; z-index:40; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.35); padding:8px 10px; border-radius:8px; font-size:12px; }
    </style>
</head>
<body>
    <div id="config-menu">
        <h2 style="margin:0 0 8px 0">Viteroads</h2>
        <div style="margin-bottom:10px">
            <label for="seed">World Seed</label>
            <input id="seed" value="endless-zen" style="width:100%;padding:8px;border-radius:6px;background:#222;color:#fff;border:1px solid #444"/>
        </div>
        <div style="margin-bottom:10px">
            <label for="complexity">Road Complexity</label>
            <select id="complexity" style="width:100%;padding:8px;border-radius:6px;background:#222;color:#fff;border:1px solid #444">
                <option value="0.6">Casual</option>
                <option value="1.0" selected>Normal</option>
                <option value="1.6">Hard</option>
                <option value="2.2">Extreme</option>
            </select>
        </div>
        <div style="margin-bottom:12px">
            <label for="timeOfDay">Time of Day</label>
            <select id="timeOfDay" style="width:100%;padding:8px;border-radius:6px;background:#222;color:#fff;border:1px solid #444">
                <option>Morning</option>
                <option selected>Midday</option>
                <option>Evening</option>
                <option>Night</option>
            </select>
        </div>
        <button id="start-button" style="width:100%;padding:10px;border-radius:8px;background:#1db954;border:none;color:#fff;cursor:pointer">Drive</button>
    </div>

    <canvas id="game-canvas"></canvas>
    <canvas id="skid-canvas"></canvas>

    <div id="hud" style="display:none">
        <div id="hud-speed" style="font-size:20px;font-weight:700">0 km/h</div>
        <div id="hud-gear" style="opacity:0.85">Gear: N</div>
        <div id="hud-status" style="opacity:0.85">Status: Idle</div>
    </div>

    <div id="debug-panel" style="display:none">
        <div><label><input id="show-physics" type="checkbox"> Show physics</label></div>
        <div style="margin-top:8px"><button id="respawn">Respawn on Road</button></div>
    </div>

    <div id="tips" style="display:none">
        W/S or ↑/↓ : Throttle / Brake<br/>
        A/D or ←/→ : Steer<br/>
        Space : Handbrake (drift) &nbsp; Shift : Boost &nbsp; E : Assist toggle
    </div>

    <!-- importmap for three and cannon-es -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module">
    import * as THREE from "three";
    import * as CANNON from "cannon-es";

    // -- seeded PRNG
    function hashStringToInt(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619) >>> 0;
        }
        return h >>> 0;
    }
    function mulberry32(seed) {
        return function() {
            let t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    // --- Game class with Cannon vehicle, particles, and simple audio
    class ViteroadsGame {
        constructor(cfg) {
            this.config = cfg;
            this.prng = mulberry32(hashStringToInt(cfg.seed.toString()));
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 30000);
            this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            this.renderer.shadowMap.enabled = true;
            this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            this.clock = new THREE.Clock();

            // overlay & hud
            this.skidCanvas = document.getElementById('skid-canvas');
            this.skidCtx = this.skidCanvas.getContext('2d');
            this.resizeOverlay();

            this.hud = document.getElementById('hud');
            this.hudSpeed = document.getElementById('hud-speed');
            this.hudGear = document.getElementById('hud-gear');
            this.hudStatus = document.getElementById('hud-status');
            this.debugPanel = document.getElementById('debug-panel');
            this.tips = document.getElementById('tips');

            // control state
            this.controls = { forward:false, backward:false, left:false, right:false, handbrake:false, boost:false, assist:true };

            // containers
            this.terrain = null;
            this.roadPath = null;
            this.roadVisual = null;

            // Cannon world and vehicle pieces
            this.world = null;
            this.chassisBody = null;
            this.vehicle = null;
            this.wheelVisuals = [];

            // particles
            this.particles = [];

            // audio
            this.audioCtx = null;
            this.engineOsc = null;

            // debug flag
            this.showPhysics = false;

            this.init();
        }

        resizeOverlay() {
            this.skidCanvas.width = window.innerWidth;
            this.skidCanvas.height = window.innerHeight;
        }

        init() {
            this.setupEnvironment();
            this.generateTerrainAndRoad();
            this.setupCannon();
            this.setupVehicle();
            this.setupVehicleVisual();
            this.setupLights();
            this.setupControls();
            this.hud.style.display='block';
            this.debugPanel.style.display='block';
            this.tips.style.display='block';
            this.animate();

            window.addEventListener('resize', ()=> {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.resizeOverlay();
            });
        }

        setupEnvironment() {
            // simple time-of-day coloring
            const tod = {
                Morning: { sky:0x87CEEB, light:0xfff3d9, sun: new THREE.Vector3(300,700,-200) },
                Midday : { sky:0x87CEFF, light:0xffffff, sun: new THREE.Vector3(0,1200,0) },
                Evening: { sky:0xFF8C6B, light:0xffd6b6, sun: new THREE.Vector3(-500,400,600) },
                Night  : { sky:0x02021a, light:0x6b7bff, sun: new THREE.Vector3(0,-1000,0) }
            }[this.config.timeOfDay] || tod.Midday;

            this.scene.background = new THREE.Color(tod.sky);
            this.scene.fog = new THREE.Fog(tod.sky, 100, 4000);
            const hemi = new THREE.HemisphereLight(0xffffff, 0x444455, 0.6);
            this.scene.add(hemi);
            this.sun = new THREE.DirectionalLight(tod.light, 1.0);
            this.sun.position.copy(tod.sun);
            this.sun.castShadow = true;
            this.sun.shadow.mapSize.set(2048,2048);
            this.scene.add(this.sun);
        }

        generateTerrainAndRoad() {
            // Terrain generation (grid)
            const terrainSize = 200;           // physical size in meters across (we will scale)
            const grid = 128;                  // grid resolution
            const worldScale = 100;            // scaling to match visual size
            const heights = [];                // for Cannon Heightfield
            const positions = [];

            // generate simple value-noise using PRNG
            const noise = (x,y) => {
                // fractal-like combination
                let v = 0, amp = 1, freq = 1, gain=0.5;
                for (let i=0;i<4;i++){ v += (this.prng()*2-1)*amp; amp*=gain; freq*=2; }
                return v * 4; // adjust amplitude
            };

            // create plane geometry for visuals
            const planeSize = terrainSize * worldScale;
            const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize, grid-1, grid-1);
            const posAttr = planeGeo.attributes.position;

            for (let yi=0; yi<grid; yi++) {
                const row = [];
                for (let xi=0; xi<grid; xi++) {
                    const idx = yi*grid + xi;
                    const x = (xi/(grid-1) - 0.5) * terrainSize;
                    const y = (yi/(grid-1) - 0.5) * terrainSize;
                    const n = noise(x*0.03,y*0.03);
                    const h = Math.max(-6, Math.min(40, n));
                    row.push(h);
                    // set z coordinate in plane geometry (y is up in THREE but plane is rotated)
                    posAttr.setZ(idx, h);
                }
                heights.push(row);
            }
            planeGeo.computeVertexNormals();
            const terrainMat = new THREE.MeshStandardMaterial({ color:0x2f6b30, roughness:1.0, metalness:0 });
            this.terrain = new THREE.Mesh(planeGeo, terrainMat);
            this.terrain.rotation.x = -Math.PI/2;
            this.terrain.position.y = -10;
            this.terrain.receiveShadow = true;
            this.scene.add(this.terrain);

            // Road generation along mostly -Z, using CatmullRom curve
            const points = [];
            let last = new THREE.Vector3(0, 8, 0);
            const pointCount = 300;
            for (let i=0;i<pointCount;i++){
                const forward = - (i * 6 + 60);
                const lateral = (this.prng() - 0.5) * 80 * this.config.complexity;
                const vert = (this.prng()-0.5)*8 + (this.prng()-0.5)*12;
                const p = new THREE.Vector3(lateral, vert, forward).add(last.clone().multiplyScalar(0.08));
                points.push(p);
                last = p;
            }
            this.roadPath = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.6);

            // create an extruded ribbon for the road visual
            const roadWidth = 12;
            const shape = new THREE.Shape();
            shape.moveTo(-roadWidth/2, 0);
            shape.lineTo(roadWidth/2, 0);
            const roadGeom = new THREE.ExtrudeGeometry(shape, { steps: points.length*4, extrudePath: this.roadPath });
            roadGeom.rotateX(-Math.PI/2);
            const roadMat = new THREE.MeshStandardMaterial({ color:0x222222, roughness:0.8 });
            this.roadVisual = new THREE.Mesh(roadGeom, roadMat);
            this.roadVisual.receiveShadow = true;
            this.scene.add(this.roadVisual);

            // precompute samples for findClosestRoadSample
            this.roadSamples = [];
            const sampleCount = 1000;
            for (let i=0;i<sampleCount;i++){
                const t = i/(sampleCount-1);
                const p = this.roadPath.getPointAt(t);
                const tang = this.roadPath.getTangentAt(t);
                this.roadSamples.push({ t, p, tang });
            }

            // store terrain data for Cannon Heightfield creation
            this.terrainData = { heights, elementSize: planeSize/(grid-1), rows: grid, cols: grid, planeSize, grid };
        }

        setupCannon() {
            // Create physics world
            this.world = new CANNON.World({
                gravity: new CANNON.Vec3(0,-9.82,0)
            });
            this.world.broadphase = new CANNON.SAPBroadphase(this.world);

            // Heightfield shape from terrain heights
            const { heights, elementSize, rows } = this.terrainData;
            // CANNON heightfield expects matrix [row][col]
            const matrix = [];
            for (let i=0;i<rows;i++){
                const row = [];
                for (let j=0;j<rows;j++){
                    row.push(heights[i][j]);
                }
                matrix.push(row);
            }
            const hfShape = new CANNON.Heightfield(matrix, { elementSize: elementSize });
            const hfBody = new CANNON.Body({ mass: 0 });
            hfBody.addShape(hfShape);
            // Align the Cannon heightfield with the Three plane: Cannon Heightfield origin is at corner; shift so it matches our plane
            const half = this.terrainData.planeSize / 2;
            hfBody.position.set(-half, -10, -half); // minor offset matches how plane is positioned
            hfBody.quaternion.setFromEuler(-Math.PI/2, 0, 0); // rotate to match plane orientation
            this.world.addBody(hfBody);

            // Add a large invisible floor too for safety
            const ground = new CANNON.Body({ mass:0, shape: new CANNON.Plane() });
            ground.quaternion.setFromEuler(-Math.PI/2, 0, 0);
            ground.position.set(0,-200,0);
            this.world.addBody(ground);
        }

        setupVehicle() {
            // create chassis body
            const chassisShape = new CANNON.Box(new CANNON.Vec3(1.2, 0.45, 2.2));
            this.chassisBody = new CANNON.Body({ mass: 150 });
            this.chassisBody.addShape(chassisShape);
            // initial placement near start of road
            const start = this.roadPath.getPointAt(0.02);
            this.chassisBody.position.set(start.x, start.y + 1.8, start.z);
            this.chassisBody.angularDamping = 0.5;
            this.world.addBody(this.chassisBody);

            // Raycast vehicle
            this.vehicle = new CANNON.RaycastVehicle({
                chassisBody: this.chassisBody,
                indexRightAxis: 0,
                indexUpAxis: 1,
                indexForwardAxis: 2
            });

            const wheelOptions = {
                radius: 0.5,
                directionLocal: new CANNON.Vec3(0, -1, 0),
                axleLocal: new CANNON.Vec3(1, 0, 0),
                suspensionRestLength: 0.35,
                suspensionStiffness: 30,
                suspensionDamping: 4.0,
                frictionSlip: 3.5,
                rollInfluence: 0.01
            };

            // add wheels: front-right, front-left, rear-right, rear-left
            const wheelX = 1.0, wheelZFront = -1.6, wheelZRear = 1.6;
            wheelOptions.chassisConnectionPointLocal = new CANNON.Vec3(wheelX, 0.6, wheelZFront);
            wheelOptions.isFrontWheel = true;
            this.vehicle.addWheel({...wheelOptions});
            wheelOptions.chassisConnectionPointLocal = new CANNON.Vec3(-wheelX, 0.6, wheelZFront);
            wheelOptions.isFrontWheel = true;
            this.vehicle.addWheel({...wheelOptions});
            wheelOptions.chassisConnectionPointLocal = new CANNON.Vec3(wheelX, 0.6, wheelZRear);
            wheelOptions.isFrontWheel = false;
            this.vehicle.addWheel({...wheelOptions});
            wheelOptions.chassisConnectionPointLocal = new CANNON.Vec3(-wheelX, 0.6, wheelZRear);
            wheelOptions.isFrontWheel = false;
            this.vehicle.addWheel({...wheelOptions});

            this.vehicle.addToWorld(this.world);

            // Create wheel visual meshes and wheel physics helper bodies
            this.vehicle.wheelInfos.forEach((wi) => {
                const cylinder = new THREE.Mesh(
                    new THREE.CylinderGeometry(wi.radius, wi.radius, 0.5, 16),
                    new THREE.MeshStandardMaterial({ color:0x111111 })
                );
                cylinder.rotation.z = Math.PI/2;
                cylinder.castShadow = true;
                this.scene.add(cylinder);
                this.wheelVisuals.push(cylinder);
            });

            // small adjustments to friction while braking/handbrake will be applied in update
        }

        setupVehicleVisual() {
            // create a simple chassis visual (Three Group)
            const chassis = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 4.4), new THREE.MeshStandardMaterial({ color:0xff4444, metalness:0.2, roughness:0.4 }));
            body.position.y = 1.0;
            body.castShadow = true;
            chassis.add(body);
            const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 2.2), new THREE.MeshStandardMaterial({ color:0x222222 }));
            roof.position.set(0,1.35,-0.25);
            roof.castShadow = true;
            chassis.add(roof);

            // brake lights
            const brakeGeo = new THREE.PlaneGeometry(0.35, 0.15);
            const bl1 = new THREE.Mesh(brakeGeo, new THREE.MeshBasicMaterial({ color:0x220000 }));
            const bl2 = bl1.clone();
            bl1.position.set(0.6, 0.7, 2.3); bl1.rotation.y = Math.PI;
            bl2.position.set(-0.6, 0.7, 2.3); bl2.rotation.y = Math.PI;
            chassis.add(bl1, bl2);
            this.brakeLights = [bl1.material, bl2.material];

            // headlights
            const head1 = new THREE.SpotLight(0xffffff, this.config.timeOfDay==='Night'?5:1.5, 1500, Math.PI/8, 0.4);
            head1.position.set(0.8, 0.6, -2.4); head1.target.position.set(0.8,0.6,-15);
            chassis.add(head1); chassis.add(head1.target);
            const head2 = head1.clone(); head2.position.set(-0.8,0.6,-2.4); head2.target.position.set(-0.8,0.6,-15);
            chassis.add(head2); chassis.add(head2.target);

            this.vehicleVisual = chassis;
            this.scene.add(this.vehicleVisual);
        }

        setupLights() {
            const fill = new THREE.DirectionalLight(0xffffff, 0.12);
            fill.position.set(-300,200,200);
            this.scene.add(fill);
        }

        setupControls() {
            document.addEventListener('keydown', (e) => this.onKey(e, true));
            document.addEventListener('keyup', (e) => this.onKey(e, false));
            document.getElementById('respawn').addEventListener('click', ()=> this.respawnOnRoad());
            document.getElementById('show-physics').addEventListener('change', (ev)=> {
                this.showPhysics = ev.target.checked;
            });

            // simple audio engine
            try {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.engineOsc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                gain.gain.value = 0.0001;
                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.value = 80;
                this.engineOsc.connect(gain);
                gain.connect(this.audioCtx.destination);
                this.engineGain = gain;
                this.engineOsc.start();
            } catch (e) {
                // audio not available
                this.audioCtx = null;
                this.engineOsc = null;
            }
        }

        onKey(e, down) {
            const key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') this.controls.forward = down;
            if (key === 's' || e.key === 'ArrowDown') this.controls.backward = down;
            if (key === 'a' || e.key === 'ArrowLeft') this.controls.left = down;
            if (key === 'd' || e.key === 'ArrowRight') this.controls.right = down;
            if (e.key === ' ') { this.controls.handbrake = down; e.preventDefault(); }
            if (e.key === 'shift') this.controls.boost = down;
            if (e.key === 'e' && !down) this.controls.assist = !this.controls.assist;
        }

        respawnOnRoad() {
            const start = this.roadPath.getPointAt(0.02);
            this.chassisBody.position.set(start.x, start.y + 2, start.z);
            this.chassisBody.velocity.set(0,0,0);
            this.chassisBody.angularVelocity.set(0,0,0);
            this.chassisBody.quaternion.set(0,0,0,1);
        }

        findClosestRoadSample(position) {
            let best=null, bestD=Infinity;
            for (let s of this.roadSamples) {
                const d = s.p.distanceToSquared(position);
                if (d < bestD) { bestD = d; best = s; }
            }
            return best;
        }

        drawSkidAtScreen(x,y, intensity=0.25) {
            const ctx = this.skidCtx;
            ctx.fillStyle = `rgba(18,18,18,${intensity})`;
            ctx.beginPath();
            ctx.ellipse(x + (Math.random()-0.5)*6, y + (Math.random()-0.5)*6, 3 + Math.random()*3, 1.2 + Math.random()*1.2, 0, 0, Math.PI*2);
            ctx.fill();
        }

        spawnDust(worldPos, amount=6) {
            // spawn simple sprite points behind car to simulate dust/smoke
            for (let i=0;i<amount;i++){
                const p = {
                    pos: worldPos.clone().add(new THREE.Vector3((Math.random()-0.5)*1.2, (Math.random()*0.5)+0.1, (Math.random()*0.6)+0.4)),
                    vel: new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.2, Math.random()*0.6 + 0.1),
                    life: 0.8 + Math.random()*0.6
                };
                this.particles.push(p);
            }
        }

        updateParticles(dt) {
            // render particles as small canvas circles projected on screen
            const ctx = this.skidCtx;
            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                p.life -= dt;
                if (p.life <= 0) { this.particles.splice(i,1); continue; }
                p.pos.addScaledVector(p.vel, dt);
                // project to screen
                const v = p.pos.clone().project(this.camera);
                const x = (v.x * 0.5 + 0.5) * this.skidCanvas.width;
                const y = (-v.y * 0.5 + 0.5) * this.skidCanvas.height;
                const alpha = Math.max(0, Math.min(1, p.life));
                ctx.fillStyle = `rgba(180,180,180,${0.18*alpha})`;
                ctx.beginPath();
                ctx.arc(x + (Math.random()-0.5)*2, y + (Math.random()-0.5)*2, 2.2 * alpha, 0, Math.PI*2);
                ctx.fill();
            }
        }

        fadeSkidCanvas() {
            // small fade to slowly remove skid marks
            this.skidCtx.fillStyle = 'rgba(0,0,0,0.02)';
            this.skidCtx.fillRect(0,0,this.skidCanvas.width,this.skidCanvas.height);
        }

        updateVehicleFromInput(dt) {
            if (!this.vehicle) return;
            // mapping controls to Cannon RaycastVehicle
            const maxEngineForce = this.controls.boost ? 4500 : 2800;
            const brakeForce = 1500;
            // steering
            const steerVal = 0.6 * (this.controls.left ? 1 : (this.controls.right ? -1 : 0));
            const speed = this.chassisBody.velocity.length();
            const speedFactor = Math.max(0.22, 1 - (speed/80));
            const finalSteer = steerVal * speedFactor;

            // apply steering to front wheels
            this.vehicle.setSteeringValue(finalSteer, 0);
            this.vehicle.setSteeringValue(finalSteer, 1);

            // engine/brake forces
            if (this.controls.forward) {
                this.vehicle.applyEngineForce(-maxEngineForce, 2);
                this.vehicle.applyEngineForce(-maxEngineForce, 3);
            } else if (this.controls.backward) {
                this.vehicle.applyEngineForce(maxEngineForce*0.5, 2);
                this.vehicle.applyEngineForce(maxEngineForce*0.5, 3);
            } else {
                // no throttle - apply small engine braking
                this.vehicle.applyEngineForce(0,2);
                this.vehicle.applyEngineForce(0,3);
            }

            // braking / handbrake
            if (this.controls.handbrake) {
                this.vehicle.setBrake(2000, 0); this.vehicle.setBrake(2000, 1);
                this.vehicle.setBrake(brakeForce, 2); this.vehicle.setBrake(brakeForce, 3);
            } else if (this.controls.backward) {
                this.vehicle.setBrake(1200, 0); this.vehicle.setBrake(1200, 1);
            } else {
                this.vehicle.setBrake(0,0); this.vehicle.setBrake(0,1);
                this.vehicle.setBrake(0,2); this.vehicle.setBrake(0,3);
            }

            // friction slip adjustment for drifting
            for (let i=0;i<this.vehicle.wheelInfos.length;i++){
                const wi = this.vehicle.wheelInfos[i];
                if (this.controls.handbrake && !wi.isFrontWheel) {
                    wi.frictionSlip = 0.7; // more slide rear wheels
                } else {
                    wi.frictionSlip = 3.5;
                }
            }
        }

        syncVisuals() {
            // chassis
            this.vehicleVisual.position.copy(this.chassisBody.position);
            this.vehicleVisual.quaternion.copy(this.chassisBody.quaternion);

            // wheels
            for (let i=0;i<this.vehicle.wheelInfos.length;i++){
                const wi = this.vehicle.wheelInfos[i];
                this.vehicle.updateWheelTransform(i);
                const t = wi.worldTransform;
                const pos = new THREE.Vector3(t.position.x, t.position.y, t.position.z);
                const quat = new THREE.Quaternion(t.quaternion.x, t.quaternion.y, t.quaternion.z, t.quaternion.w);
                const wv = this.wheelVisuals[i];
                wv.position.copy(pos);
                wv.quaternion.copy(quat);
            }
        }

        updateAudio() {
            if (!this.audioCtx || !this.engineOsc) return;
            const speed = this.chassisBody.velocity.length();
            const freq = 80 + Math.min(1500, speed * 12);
            this.engineOsc.frequency.setTargetAtTime(freq, this.audioCtx.currentTime, 0.05);
            // engine volume based on throttle
            const targetGain = this.controls.forward ? 0.08 : 0.015;
            this.engineGain.gain.setTargetAtTime(targetGain, this.audioCtx.currentTime, 0.06);
        }

        animate() {
            requestAnimationFrame(this.animate.bind(this));
            const dt = Math.min(this.clock.getDelta(), 1/30);

            // update controls -> vehicle forces
            this.updateVehicleFromInput(dt);

            // step physics
            this.world.step(1/60, dt, 3);

            // sync visuals to physics
            this.syncVisuals();

            // camera chase
            this.updateCamera(dt);

            // update HUD
            const speed = Math.round(this.chassisBody.velocity.length()*3.6); // m/s -> km/h
            this.hudSpeed.innerText = `${speed} km/h`;
            this.hudGear.innerText = `Gear: ${this.chassisBody.velocity.z < -0.5 ? 'D' : (speed>0 ? 'D' : 'N')}`;
            this.hudStatus.innerText = `Status: ${this.controls.handbrake ? 'Handbrake / Drifting' : (this.controls.boost ? 'Boost' : (this.controls.forward ? 'Driving' : 'Coasting'))}`;

            // draw skid/dust when necessary
            // compute local lateral slip estimate: if handbrake and some speed, spawn dust and skids
            if (this.controls.handbrake && this.chassisBody.velocity.length() > 4) {
                // spawn dust at rear of car
                const rear = new THREE.Vector3(0,0.4,1.8).applyQuaternion(this.vehicleVisual.quaternion).add(this.vehicleVisual.position);
                this.spawnDust(rear, 5);
                // draw a screen-space skid ellipse
                const sp = rear.clone().project(this.camera);
                const sx = (sp.x*0.5+0.5) * this.skidCanvas.width;
                const sy = (-sp.y*0.5+0.5) * this.skidCanvas.height;
                this.drawSkidAtScreen(sx, sy, 0.12);
            }

            // update particles and fade overlay
            this.fadeSkidCanvas();
            this.updateParticles(dt);

            // wheels spinning visual: rotate wheel meshes around their local X based on angularVelocity approximated by wheelInfo
            for (let i=0;i<this.vehicle.wheelInfos.length;i++){
                const wi = this.vehicle.wheelInfos[i];
                const wv = this.wheelVisuals[i];
                if (wv) {
                    // spin visually by rotating around local X
                    wv.rotateX(- (this.chassisBody.velocity.length()/6) * dt);
                }
            }

            // update brake light visuals
            const braking = this.controls.backward || this.controls.handbrake;
            for (let m of this.brakeLights) m.color = new THREE.Color(braking ? 0xff3300 : 0x220000);

            // update audio
            this.updateAudio();

            // render physics debug if requested (simple bounding boxes)
            if (this.showPhysics) {
                // (Optional) - further debug overlays could be drawn here
            }

            this.renderer.render(this.scene, this.camera);
        }

        updateCamera(dt) {
            // smooth chase camera with spring
            const desired = new THREE.Vector3(0, 5, 12).applyQuaternion(this.vehicleVisual.quaternion).add(this.vehicleVisual.position);
            this.camera.position.lerp(desired, Math.min(dt*4.5, 1));
            const look = new THREE.Vector3(0, 1.6, -14).applyQuaternion(this.vehicleVisual.quaternion).add(this.vehicleVisual.position);
            this.camera.lookAt(look);
        }
    }

    // --- Start game on button press (replace UI) ---
    document.getElementById('start-button').addEventListener('click', async () => {
        const config = {
            seed: document.getElementById('seed').value || 'seed',
            complexity: parseFloat(document.getElementById('complexity').value),
            timeOfDay: document.getElementById('timeOfDay').value
        };
        document.getElementById('config-menu').style.display = 'none';
        // resume audio on user gesture (required by some browsers)
        try {
            // create AudioContext on user gesture for engine sound
            // ViteroadsGame will create its own AudioContext but ensure resume if exists
            if (window.audioCtx && window.audioCtx.state === 'suspended') await window.audioCtx.resume();
        } catch(e) {}
        window.viteroads = new ViteroadsGame(config);
    });

    </script>
</body>
